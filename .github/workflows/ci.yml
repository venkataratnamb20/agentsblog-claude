name: CI
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conventional commits (PR title and commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "$PR_TITLE" | npx --no -- commitlint
          npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Secret scan
        run: npm run secrets:scan
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - name: Production-style build (drafts excluded, staging noindex)
        run: npm run build
      - name: Build renders draft posts and SEO output
        run: PREVIEW_DRAFTS=true npm run build
      - name: Verify SEO output
        run: |
          trap 'find dist -maxdepth 3 | head -40' ERR
          grep -q 'noindex' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
          grep -q 'application/ld+json' dist/posts/welcome/index.html
          grep -q 'rel="canonical"' dist/posts/welcome/index.html
          test -f dist/sitemap-index.xml
          test -f dist/rss.xml
